<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050514">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vexa A.I Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050514; --cyan:#3de0ff; --blue:#2b5cff; --violet:#7b2fff; --pink:#e066ff;
  --glass:rgba(5,8,24,.72); --line:rgba(61,224,255,.85);
  --font:'Chakra Petch','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:var(--font);overflow:hidden}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
.bg{position:absolute;inset:0;background:url(images/bg.jpg) center/cover no-repeat;opacity:.9}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(5,5,20,.35) 0%,rgba(5,5,20,.1) 35%,rgba(5,5,20,.75) 70%,rgba(5,5,20,.95) 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 150px;overflow-y:auto}
.screen.on{display:flex}
.bell{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;width:50px;height:50px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--glass);display:grid;place-items:center;color:var(--cyan);
  box-shadow:0 0 14px rgba(61,224,255,.45)}
.brand{margin-top:6px;font-weight:600;font-size:18px;color:var(--cyan);text-shadow:0 0 12px var(--cyan);letter-spacing:.5px}
.avatar{margin-top:14px;width:min(62vw,250px);aspect-ratio:1;border-radius:50%;object-fit:cover;
  border:2px solid var(--line);box-shadow:0 0 28px rgba(61,224,255,.55),0 0 60px rgba(123,47,255,.35)}
h1{margin-top:18px;font-size:44px;font-weight:600;letter-spacing:1px;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.pill{margin-top:8px;padding:12px 26px;border-radius:30px;background:var(--cyan);color:#021018;font-size:17px;
  box-shadow:0 0 22px rgba(61,224,255,.6)}
.pill b{font-weight:700}
.actions{margin-top:28px;width:100%;display:flex;border:1.5px solid var(--line);border-radius:34px;background:var(--glass);
  box-shadow:0 0 16px rgba(61,224,255,.4);overflow:hidden}
.actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 6px;
  background:none;border:0;color:#fff;font:600 16px var(--font)}
.actions button+button{border-left:1px solid rgba(61,224,255,.3)}
.actions svg{color:var(--cyan)}
.actions button:active{background:rgba(61,224,255,.15)}
.label{align-self:flex-start;margin:26px 0 10px 4px;font-size:20px;font-weight:600}
.list{width:100%;display:flex;flex-direction:column;gap:14px}
.item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:44px;border:1.5px solid var(--line);
  background:var(--glass);box-shadow:0 0 14px rgba(61,224,255,.35);text-align:left;color:#fff;font-family:var(--font)}
.item.sel{box-shadow:0 0 20px rgba(61,224,255,.8)}
.thumb{width:62px;height:62px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cyan);flex:none}
.thumb.ic{display:grid;place-items:center;background:#050514;color:var(--cyan)}
.item h3{font-size:24px;font-weight:600}
.item p{margin-top:2px;font-size:13px;color:var(--cyan);letter-spacing:1px;text-transform:uppercase}
/* secondary screens */
.panel{margin-top:40px;width:100%;padding:28px 22px;border-radius:30px;border:1.5px solid var(--line);background:var(--glass);text-align:center}
.panel h2{font-size:28px;margin-bottom:8px}
.panel p{color:#b9c6e6;font-size:15px;line-height:1.5}
.screen.plain .bg2{display:none}
/* nav */
nav{position:absolute;left:0;right:0;bottom:0;height:calc(120px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,rgba(5,5,20,.9) 45%,rgba(61,110,255,.55));z-index:5}
.nb{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;
  gap:6px;background:none;border:0;color:#7a86a8;font:600 12px var(--font);letter-spacing:1.5px}
.nb .c{width:60px;height:60px;border-radius:50%;background:#000;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.nb.l{left:36px}.nb.r{right:36px}
.nb.on{color:var(--cyan)}
.nb.on .c{border-color:var(--cyan);box-shadow:0 0 16px rgba(61,224,255,.6)}
.nb.home{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.nb.home .c{width:104px;height:104px;border:2px solid var(--cyan);background:rgba(5,5,20,.88);
  box-shadow:0 0 26px rgba(61,224,255,.8),0 0 50px rgba(123,47,255,.45);color:var(--cyan);gap:2px}
.nb.home .c span{font-size:12px;letter-spacing:1.5px}
.nb.home:not(.on) .c{border-color:rgba(61,224,255,.5);box-shadow:0 0 14px rgba(61,224,255,.35)}
@media (max-height:700px){h1{font-size:36px}.avatar{width:min(50vw,200px)}}
</style>
</head>
<body>
<div id="app">
  <div class="bg"></div>

  <section class="screen on" id="home">
    <button class="bell" aria-label="Notifications"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg></button>
    <div class="brand">Vexa A.I Pro</div>
    <img class="avatar" src="images/avatar.jpg" alt="Vexa">
    <h1>Vexa</h1>
    <div class="pill">Powered By <b>Vexa A.I Pro</b></div>
    <div class="actions">
      <button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Remove</button>
      <button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>Start</button>
      <button><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Symbols</button>
    </div>
    <div class="label">Modules list:</div>
    <div class="list">
      <div class="item sel"><img class="thumb" src="images/avatar.jpg" alt=""><div><h3>Vexa</h3><p>Powered by Vexa A.I Pro</p></div></div>
      <div class="item"><div class="thumb ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></div><div><h3>Module two</h3><p>Placeholder</p></div></div>
    </div>
  </section>

  <section class="screen" id="connect">
    <div class="panel"><h2>Connect</h2><p>The Connect screen will go here. Send me its reference image next.</p></div>
  </section>

  <section class="screen" id="settings">
    <div class="panel"><h2>Settings</h2><p>The Settings screen will go here. Send me its reference image next.</p></div>
  </section>

  <nav>
    <button class="nb l" data-t="connect"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></span>CONNECT</button>
    <button class="nb home on" data-t="home"><span class="c"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg><span>HOME</span></span></button>
    <button class="nb r" data-t="settings"><span class="c"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></span>SETTINGS</button>
  </nav>
</div>
<script>
const nb=document.querySelectorAll('.nb'),sc=document.querySelectorAll('.screen');
nb.forEach(b=>b.addEventListener('click',()=>{
  nb.forEach(x=>x.classList.toggle('on',x===b));
  sc.forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
}));
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
