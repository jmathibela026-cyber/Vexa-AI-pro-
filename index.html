.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,20,.2) 0%,rgba(5,5,20,.05) 35%,rgba(5,5,20,.5) 68%,rgba(5,5,20,.85) 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 24px 130px;overflow-y:auto}
.screen.on{display:flex}
.screen>*{flex-shrink:0}
.bell{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);left:24px;width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(4,8,22,.55);display:grid;place-items:center;color:var(--cyan);
  box-shadow:0 0 10px rgba(61,224,255,.4)}
.brand{height:18px;line-height:18px;margin-top:10px;font-weight:700;font-size:16px;color:var(--cyan);text-shadow:0 0 10px var(--cyan);letter-spacing:.5px}
.av{margin-top:21px;width:min(63vw,300px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  border:1.5px solid var(--line);box-shadow:0 0 18px rgba(61,224,255,.45);background:#000}
.av img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);display:block}
h1{margin-top:12px;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:.5px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.pill{margin-top:14px;padding:8px 24px;border-radius:30px;background:var(--cyan);color:#021018;font-size:14px;font-weight:500;
  box-shadow:0 0 18px rgba(61,224,255,.55);white-space:nowrap}
.pill b{font-weight:800;font-size:17px;margin-left:2px}
.actions{margin-top:36px;width:100%;display:flex;border:1.5px solid var(--line);border-radius:30px;background:var(--glass);
  box-shadow:0 0 12px rgba(61,224,255,.4)}
.actions button{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:15px 2px;
  background:none;border:0;color:#fff;font:600 14px var(--font);border-radius:30px;white-space:nowrap}
.actions button+button::before{content:"";position:absolute;left:0;top:28%;bottom:28%;width:1px;background:rgba(61,224,255,.45)}
.actions svg{color:var(--cyan);flex:none}
.actions button:active{background:rgba(61,224,255,.15)}
.label{align-self:flex-start;margin:30px 0 12px 4px;font-size:16px;font-weight:600}
.list{width:100%;display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 14px;border-radius:44px;border:1.5px solid rgba(61,224,255,.75);
  border-bottom-color:var(--cyan);background:var(--glass);box-shadow:0 2px 12px rgba(61,224,255,.35);color:#fff}
.thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cyan);flex:none}
.thumb.ic{display:grid;place-items:center;background:#050514;color:var(--cyan)}
.item h3{font-size:22px;font-weight:600;line-height:1.1}
.item p{margin-top:3px;font-size:11px;color:var(--cyan);letter-spacing:1px;text-transform:uppercase}
.panel{margin-top:40px;width:100%;padding:28px 22px;border-radius:30px;border:1.5px solid var(--line);background:var(--glass);text-align:center}
.panel h2{font-size:26px;margin-bottom:8px}
.panel p{color:#b9c6e6;font-size:14px;line-height:1.5}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;
  background:linear-gradient(180deg,transparent,rgba(5,5,20,.8) 40%,rgba(0,225,255,.75))}
.nb{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;
  gap:4px;background:none;border:0;color:rgba(255,255,255,.4);font:600 10px var(--font);letter-spacing:2px}
.nb .c{width:42px;height:42px;border-radius:50%;background:#000;border:1px solid rgba(255,255,255,.1);display:grid;place-items:center}
.nb .c svg{width:20px;height:20px}
.nb.l{left:21%;transform:translateX(-50%)}
.nb.r{left:79%;transform:translateX(-50%)}
.nb.on{color:var(--cyan)}
.nb.on .c{border-color:var(--cyan);box-shadow:0 0 12px rgba(61,224,255,.6)}
.nb.home{left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.nb.home .c{width:76px;height:76px;border:2px solid var(--cyan);background:rgba(5,8,22,.75);
  box-shadow:0 0 22px rgba(61,224,255,.8);color:var(--cyan);gap:2px;display:flex;flex-direction:column;justify-content:center}
.nb.home .c svg{width:24px;height:24px}
.nb.home .c span{font-size:10px;letter-spacing:1.5px;font-weight:600}
</style>
</head>
